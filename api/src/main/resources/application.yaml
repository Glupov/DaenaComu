server:
    port: ${PORT:8080}

spring:
    config:
        import: optional:file:.env[.properties]

    application:
        name: daenacomu-api

    main:
        banner-mode: console

    banner:
        location: classpath:banner.txt

    datasource:
        url: ${DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:daenacomu_db}}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: org.postgresql.Driver

    flyway:
        enabled: true
        locations:
            - classpath:db/migration
            - classpath:db/seed
        baseline-on-migrate: true
        baseline-version: 0
        validate-on-migrate: true
        clean-disabled: true

    jpa:
        hibernate:
            ddl-auto: none
        properties:
            hibernate:
                format_sql: true
        show-sql: false

    jwt:
        secret: ${JWT_SECRET}
        access-token:
            expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:86400000}
        refresh-token:
            expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
